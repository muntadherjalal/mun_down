name: mun_down
description: "A scalable Video & Audio Downloader app."
publish_to: 'none'
version: 1.5.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Dependency Injection
  get_it: ^8.0.3

  # Local Database
  # isar removed as it's not used yet

  # Path & Permissions
  path_provider: ^2.1.5
  permission_handler: ^11.3.1

  # WebView
  webview_flutter: ^4.13.0
  webview_flutter_wkwebview: ^3.17.0
  webview_flutter_android: ^4.0.0


  # File Actions
  share_plus: ^10.1.4
  open_filex: ^4.5.0

  # Video Player (media_kit - libmpv based, robust playback)
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5

  # Media muxing (video+audio merge for high-quality YouTube downloads)
  ffmpeg_kit_flutter_new: ^4.1.0

  # Biometric Auth
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.1
  shared_preferences: ^2.3.5
  audio_session: ^0.2.3
  dartz: ^0.10.1
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15

  # App Icon Generation
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.5
  bloc_test: ^10.0.0
  test: ^1.30.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.jpeg"
  adaptive_icon_background: "#141422"
  adaptive_icon_foreground: "assets/icon/app_icon.jpeg"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/