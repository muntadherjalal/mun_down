name: mun_down
description: "A scalable Video & Audio Downloader app."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^9.1.1
  equatable: ^2.0.7

  # Networking
  dio: ^5.8.0+1

  # Dependency Injection
  get_it: ^8.0.3

  # Local Database
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Path & Permissions
  path_provider: any
  permission_handler: any

  # WebView
  webview_flutter: ^4.13.0

  # YouTube Media Extraction
  youtube_explode_dart: ^2.3.9

  # File Actions
  share_plus: any
  open_filex: any

  # Video Player
  video_player: any
  chewie: any

  # Biometric Auth
  local_auth: any
  connectivity_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Code Generation
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
