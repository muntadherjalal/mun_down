name: Build MunDown (iOS IPA & Android APK)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ────────────────────────────────────────────────────────────
  # 1. Job لبناء نسخة الأيفون (iOS)
  # ────────────────────────────────────────────────────────────
  build-ios:
    name: Build iOS IPA (Unsigned)
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Build iOS release (unsigned)
        run: flutter build ios --release --no-codesign
        env:
          COCOAPODS_DISABLE_STATS: "true"

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r -9 mun_down.ipa Payload/

      - name: Upload iOS IPA
        uses: actions/upload-artifact@v4
        with:
          name: MunDown-iOS-IPA
          path: mun_down.ipa
          retention-days: 7

  # ────────────────────────────────────────────────────────────
  # 2. Job لبناء نسخة الأندرويد (Android)
  # ────────────────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK Release (Split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload Android APKs
        uses: actions/upload-artifact@v4
        with:
          name: MunDown-Android-APKs
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 7